name: Validate and deploy to Hetzner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hetzner-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_EVENTS_ENABLED: 'false'
      NEXT_PUBLIC_CONTACT_ENABLED: 'false'
      CONTACT_ENABLED: 'false'
      EXPO_PUBLIC_API_URL: https://api.lslschool.uz/api
      EXPO_PUBLIC_SOCKET_URL: https://api.lslschool.uz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Test and package exact commit
        run: bash deploy/ci-release.sh
      - name: Deploy through project-scoped SSH command
        env:
          DEPLOY_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/lsl_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/lsl_deploy" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/lsl_deploy"' EXIT
          ssh -T -i "$HOME/.ssh/lsl_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes root@37.27.5.14 "deploy $GITHUB_SHA" < release.tar.gz
